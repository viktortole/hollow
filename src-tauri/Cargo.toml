[package]
name = "hollow"
version = "1.0.0"
description = "A gamified fasting tracker widget"
authors = ["Hollow"]
edition = "2021"

[lib]
name = "hollow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned to a specific 2.x for reproducible builds. Bump deliberately, not
# accidentally — see docs/RELEASE-CHECKLIST.md and KNOWN-ISSUES § 5.
tauri-build = { version = "=2.5.6", features = [] }

# Cargo features — switch between desktop (default) and mobile builds.
#   cargo build                                    → desktop (default)
#   cargo build --no-default-features --features mobile  → mobile
[features]
default = ["desktop"]
desktop = ["tauri/tray-icon"]
mobile = []

[dependencies]
# Tauri itself is pinned exact for v1.0.0 release reproducibility. The plugins
# float on minor since they're more stable across patches.
tauri = { version = "=2.10.3", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
