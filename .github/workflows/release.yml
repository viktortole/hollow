name: Release

# Triggered by pushing a tag like v1.0.0. Builds the desktop installer on
# every supported OS (Windows, macOS, Linux) and attaches them to the GitHub
# Release for that tag.
#
# Mobile (APK / IPA) signed-build is intentionally NOT here yet — it needs
# the Android keystore + iOS provisioning profile in repository secrets,
# which is a release-engineering task in its own right. See RELEASE-CHECKLIST.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ''
            label: 'Windows (x64 NSIS)'
          - os: macos-latest
            target: 'aarch64-apple-darwin'
            label: 'macOS (Apple Silicon)'
          - os: macos-latest
            target: 'x86_64-apple-darwin'
            label: 'macOS (Intel)'
          - os: ubuntu-22.04
            target: ''
            label: 'Linux (AppImage + .deb)'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Hollow ${{ github.ref_name }}'
          releaseBody: |
            See `CHANGELOG.md` for full release notes.

            **Downloads** below — pick your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
